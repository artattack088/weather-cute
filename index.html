<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🌸 Cute Weather </title>
</head>

<body>

  <div id="scene">
    <div class="sun">☀️</div>

    <div class="cloud cloud1">☁️</div>
    <div class="cloud cloud2">☁️</div>
    <div class="cloud cloud3">☁️</div>

    <div id="rain"></div>
    <div id="snow"></div>
  </div>

  <div id="controls">
    <button onclick="setWeather('sunny')">☀️</button>
    <button onclick="setWeather('rainy')">🌧️</button>
    <button onclick="setWeather('snowy')">❄️</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
